<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Example</title>

    <script>
        function showMessage() {
            alert("Welcome to inline JS");
        }
    </script>
</head>

<body>

    <h2>Welcome to JavaScript</h2>

    <button onclick="alert('Welcome to inline JS')">Submit 1</button>

    <button onclick="showMessage()">Submit 2</button>

</body>

</html>
